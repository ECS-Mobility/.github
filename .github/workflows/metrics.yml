name: Organization Metrics

on:
  # Se ejecuta diariamente a las 3:00 AM (Europe/Madrid)
  schedule:
    - cron: "0 1 * * *"
  # Permite ejecucion manual desde la pestaña Actions
  workflow_dispatch:

jobs:
  organization-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Metricas generales de la organizacion
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ECS-Mobility
          template: classic
          base: activity, community, repositories
          base_indepth: yes
          config_timezone: Europe/Madrid
          config_output: svg
          config_padding: 0, 8 + 6%
          filename: profile/assets/metrics.svg

      # Lenguajes mas utilizados en la organizacion
      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ECS-Mobility
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: Europe/Madrid
          config_output: svg
          filename: profile/assets/languages.svg
